<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türkiye İl / İlçe Haritası</title>

  <!-- OpenLayers kütüphanesinin kendi CSS dosyası (harita kontrolleri için gerekli) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">

  <!-- Bizim kendi görsel tasarım dosyamız -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Haritanın üstünde duran İl / İlçe seçim kutuları -->
  <div id="controls">
    <div class="control-group">
      <label for="ilSelect">İl Seçimi</label>
      <select id="ilSelect">
        <option value="">-- İl Seçin --</option>
      </select>
    </div>

    <div class="control-group">
      <label for="ilceSelect">İlçe Seçimi</label>
      <select id="ilceSelect" disabled>
        <option value="">-- Önce İl Seçin --</option>
      </select>
    </div>
  </div>

  <!-- Tam ekran harita alanı -->
  <div id="map"></div>

  <!-- Veri çekilirken gösterilecek "Yükleniyor..." katmanı -->
  <div id="loading">
    <div id="loading-box">Yükleniyor...</div>
  </div>

  <!--
    OpenLayers kütüphanesi: normal (klasik) bir <script> etiketi ile yükleniyor.
    Bu, sayfada global bir "ol" nesnesi oluşturur; app.js içinde ol.Map,
    ol.source.Vector gibi ifadeleri bu sayede kullanabiliyoruz.
    Build aracı (Vite/Webpack) YOK, npm install YOK — her şey CDN üzerinden geliyor.
  -->
  <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

  <!--
    Kendi uygulama kodumuz: type="module" olduğu için içinde
    "import { createClient } from '...'" gibi ES module import ifadeleri kullanabiliyoruz.
  -->
  <script type="module" src="app.js"></script>

</body>
</html>
